name: CI

on:
  push:
    branches: [wip]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR makes the previous run's result
# irrelevant, so cancel it instead of letting both finish. github.ref is
# refs/pull/N/merge for PRs and refs/heads/wip for pushes, so each PR and
# the branch get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates nixosConfigurations.* (module errors, type errors,
      # assertions), the flake's own schema, and the home-manager
      # generation exposed under `checks` (homeConfigurations is not a
      # standard output that flake check evaluates on its own).
      #
      # --no-build: evaluation only, the same depth of coverage the host
      # configurations get anyway (flake check never builds those).
      # Building the home check meant compiling unfree packages that no
      # public cache carries (bambu-studio ~84 min, vscode ~10 min) on
      # every run. Renovate bumps under pkgs/ still get a real build via
      # renovate-fix-hash.yml.
      - name: nix flake check
        run: nix flake check --keep-going --no-build

  format:
    name: nix fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Uses the formatter declared in the flake's `formatter` output, so
      # `nix fmt` locally always matches what CI expects.
      - name: Check formatting
        run: nix fmt -- --ci

  lint:
    name: statix & deadnix (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Advisory only: the repo currently has widespread, mostly-stylistic
      # findings (unused `config`/`pkgs` module args, repeated top-level
      # attribute keys) that are intentional/idiomatic in many NixOS
      # modules. Reporting without blocking merges until those are
      # triaged/cleaned up on purpose.
      - name: statix check
        run: nix run nixpkgs#statix -- check .
        continue-on-error: true

      - name: deadnix
        run: nix run nixpkgs#deadnix -- .
        continue-on-error: true
