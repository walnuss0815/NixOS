name: CI

on:
  push:
    branches: [wip]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates nixosConfigurations.* (module errors, type errors,
      # assertions) plus the flake's own schema, and builds the
      # home-manager generation exposed under `checks`, since
      # homeConfigurations is not a standard output that flake check
      # evaluates on its own.
      - name: nix flake check
        run: nix flake check --keep-going

  format:
    name: nix fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Uses the formatter declared in the flake's `formatter` output, so
      # `nix fmt` locally always matches what CI expects.
      - name: Check formatting
        run: nix fmt -- --check .

  lint:
    name: statix & deadnix (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Advisory only: the repo currently has widespread, mostly-stylistic
      # findings (unused `config`/`pkgs` module args, repeated top-level
      # attribute keys) that are intentional/idiomatic in many NixOS
      # modules. Reporting without blocking merges until those are
      # triaged/cleaned up on purpose.
      - name: statix check
        run: nix run nixpkgs#statix -- check .
        continue-on-error: true

      - name: deadnix
        run: nix run nixpkgs#deadnix -- .
        continue-on-error: true
