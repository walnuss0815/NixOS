# Hyprlock screen locker configuration
# Shows a blurred version of the current wallpaper with a centered clock
# Uses the same wallpaper directory as hyprpaper

background {
    monitor =
    path = ~/Pictures/Wallpapers/
    blur_passes = 3
    blur_size = 10
    noise = 0.05
}

# Password input field (centered, rounded, semi-transparent)
input-field {
    monitor =
    size = 240, 54
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    rounding = 14
    placeholder_text =
    fail_color = rgba(255, 100, 100, 1.0)
    fail_text =
}

# Large clock display (HH:MM)
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = Noto Sans
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date display below the clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %d')"
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = Noto Sans
    position = 0, -120
    halign = center
    valign = center
}
