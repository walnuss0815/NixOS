# Hypridle idle management daemon
#
# After 5 minutes of inactivity: lock screen
# After 10 minutes: turn off display (until activity resumes)

general {
    # Called by loginctl lock-session / external lock triggers
    lock_cmd = hyprlock
}

# Lock screen after 5 minutes of idle
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Turn off display after 10 minutes; restore on activity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
