/* Fuzzel launcher / dmenu
 * Centered, rounded dark popup with Catppuccin-inspired colours.
 * Bound to Super+R in the Hyprland config.
 */

[main]
font = Noto Sans:size=12
icons-enabled = yes
icon-theme = Papirus-Dark
prompt = Apps>
layer = overlay
width = 56
lines = 8
horizontal-pad = 14
vertical-pad = 10
inner-pad = 8
line-height = 28

[colors]
background = 181825ee
text = cdd6f4ff
prompt = ffffff4d
input = cdd6f4ff
placeholder = ffffff40
selection = ffffff1a
selection-text = cdd6f4ff
match = 33ccffff

[border]
width = 0
radius = 16
color = ffffff14